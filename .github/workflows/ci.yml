name: ci

on:
  push:
    branches:
      - "main"
      - "dev"

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    outputs:
      repo_name: ${{ steps.extract_repo_name.outputs.repo_name }}
      branch_name: ${{ steps.extract_branch.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract repository name
        shell: bash
        run: echo "repo_name=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT
        id: extract_repo_name

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set Dockerfile based on branch
        id: get_dockerfile
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "dockerfile=./Dockerfile.dev" >> $GITHUB_OUTPUT
          else
            echo "dockerfile=./Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.get_dockerfile.outputs.dockerfile }}
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ steps.extract_repo_name.outputs.repo_name }}-${{ steps.extract_branch.outputs.branch }}:1.0.${{ github.run_number }}

  update-infra-repo:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout Infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: Xanda-Labs/Infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}

      - name: Update image version in Infrastructure
        run: |
          sed -i "s|\(image: ${REGISTRY_URL}/${GITHUB_REPO}-${BRANCH_NAME}:1\.0\.\)[0-9]\+|\1${GITHUB_RUN_NUMBER}|" dev/php-apps/invoicly/invoicly-dev.yaml
        env:
          BRANCH_NAME: ${{ needs.docker-build-push.outputs.branch_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPO: ${{ needs.docker-build-push.outputs.repo_name }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Update ${GITHUB_REPO}:${BRANCH_NAME} to 1.0.${GITHUB_RUN_NUMBER}"
          git push
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPO: ${{ needs.docker-build-push.outputs.repo_name }}
          BRANCH_NAME: ${{ needs.docker-build-push.outputs.branch_name }}